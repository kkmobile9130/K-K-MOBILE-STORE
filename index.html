<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K K MOBILE STORE</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111827}
header{background:#111827;color:white;text-align:center;padding:20px 12px}
header h1{margin:0;color:#facc15;font-size:27px}
header p{margin:6px 0 0}
.wrap{max-width:1100px;margin:auto;padding:12px 12px 90px}
#search{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:8px 0}
#categories{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px}
#categories button{white-space:nowrap;border:0;border-radius:20px;background:#1f2937;color:#fff;padding:10px 15px}
#categories button.active{background:#eab308;color:#111827}
#status{font-size:13px;color:#4b5563;margin:4px 0 12px}
#products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:12px;padding:10px;box-shadow:0 2px 8px #00000012;min-width:0}
.card img{width:100%;height:135px;object-fit:contain;background:#f9fafb;border-radius:8px}
.card h3{font-size:15px;margin:9px 0 5px}
.desc{font-size:12px;color:#6b7280;min-height:28px}
.price{font-weight:bold;color:#15803d;margin:8px 0}
.add{width:100%;padding:10px;border:0;border-radius:8px;background:#111827;color:white;font-weight:bold}
#cartbar{position:fixed;bottom:0;left:0;width:100%;padding:12px;background:#16a34a;color:white;border:0;font-size:16px;font-weight:bold}
#cartbox{display:none;background:white;border-radius:12px;padding:12px;margin:12px 0;box-shadow:0 2px 8px #0002}
.cartrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
.qty button{padding:3px 8px;margin:0 3px}
#checkout{background:#16a34a;color:white;border:0;border-radius:8px;padding:12px;width:100%;margin-top:10px;font-weight:bold}
@media(min-width:650px){
#products{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
<h1>K K MOBILE</h1>
<p>Mobile Accessories Store</p>
</header>

<main class="wrap">

<input id="search" placeholder="Search products..." oninput="renderProducts()">

<div id="categories"></div>

<div id="status">Loading products...</div>

<section id="products"></section>

<section id="cartbox">
<h3>Your Cart</h3>
<div id="cartitems"></div>
<p id="total"></p>
<button id="checkout" onclick="sendOrder()">Order on WhatsApp</button>
</section>

</main>

<button id="cartbar" onclick="toggleCart()">
🛒 View Cart (<span id="cartcount">0</span>)
</button>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpN3j7QDGI12PspEOc3t_CxjX0pPnDQkiVJJmqiPwNgbedynfytLTj19WpamrF7uebg7ryQ7Pl8T1H/pub?gid=2075682089&single=true&output=csv";

const WHATSAPP_NUMBER = "918055383860";

let products=[], cart={}, activeCategory="All";

function parseCSV(text){
const rows=[];
let row=[],field="",quoted=false;

for(let i=0;i<text.length;i++){
const c=text[i],n=text[i+1];

if(c==='"' && quoted && n==='"'){
field+='"';i++;
}
else if(c==='"'){
quoted=!quoted;
}
else if(c===',' && !quoted){
row.push(field);field="";
}
else if((c==='\n'||c==='\r')&&!quoted){
if(c==='\r'&&n==='\n')i++;
row.push(field);
if(row.some(x=>x.trim()!==""))rows.push(row);
row=[];field="";
}
else{
field+=c;
}
}

row.push(field);
if(row.some(x=>x.trim()!==""))rows.push(row);

return rows;
}

function normalize(s){
return (s||"").replace(/^\uFEFF/,"").trim().toLowerCase();
}

function safeImage(url){
return /^https?:\/\//i.test(url||"")?url:"https://placehold.co/400x300?text=K+K+MOBILE";
}

async function loadProducts(){

const status=document.getElementById("status");

try{

const response=await fetch(CSV_URL,{cache:"no-store"});

if(!response.ok)throw new Error("Sheet could not be loaded");

const rows=parseCSV(await response.text());

if(rows.length<2)throw new Error("No product rows found");

const heads=rows[0].map(normalize);

const col=(...names)=>heads.findIndex(h=>names.includes(h));

const ix={
name:col("product name","name"),
price:col("price (₹)","price","price (rs)"),
cat:col("category"),
img:col("image url","image"),
desc:col("description"),
stock:col("stock qty","stock"),
available:col("available")
};

products=rows.slice(1).map(r=>({

name:(r[ix.name]||"").trim(),

price:Number((r[ix.price]||"0").replace(/[^\d.]/g,""))||0,

category:(r[ix.cat]||"Other").trim()||"Other",

image:safeImage((r[ix.img]||"").trim()),

description:(r[ix.desc]||"").trim(),

stock:(r[ix.stock]||"").trim(),

available:(r[ix.available]||"Yes").trim().toLowerCase()

})).filter(p=>p.name && p.available!=="no" && p.available!=="false");

status.textContent=products.length+" products loaded.";

renderCategories();
renderProducts();

}
catch(e){

status.textContent="Products could not load. Please check your Google Sheet.";

document.getElementById("products").innerHTML="<p>Product list unavailable right now.</p>";

}

}

function renderCategories(){

const cats=["All",...new Set(products.map(p=>p.category))];

document.getElementById("categories").innerHTML=cats.map(c=>
`<button class="${c===activeCategory?'active':''}" onclick="setCategory(${JSON.stringify(c)})">${escapeHTML(c)}</button>`
).join("");

}

function setCategory(c){
activeCategory=c;
renderCategories();
renderProducts();
}

function escapeHTML(s){

return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&
